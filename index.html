<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">

  <title>Passcode Screen</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="viewport">

    <!-- PASSCODE SCREEN -->
    <div id="stage">

      <div id="keypad">

        <button class="key" data-key="1"></button>
        <button class="key" data-key="2"></button>
        <button class="key" data-key="3"></button>

        <button class="key" data-key="4"></button>
        <button class="key" data-key="5"></button>
        <button class="key" data-key="6"></button>

        <button class="key" data-key="7"></button>
        <button class="key" data-key="8"></button>
        <button class="key" data-key="9"></button>

        <button class="key" data-key="0"></button>

      </div>


      <div id="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </div>

    </div>


    <!-- THIS IS NOW OUTSIDE #stage -->
    <!-- It is positioned relative to the actual iPad screen -->
    <button
      id="revealCodeButton"
      aria-label="Show entered code">
    </button>


    <!-- CODE DISPLAY -->
    <div id="codePanel">

      <div id="codePanelBox">

        <div class="codePanelTitle">
          Funny code
        </div>

        <div id="revealedCode">
          Nothing entered
        </div>

        <button id="closeCodePanel">
          Close
        </button>

      </div>

    </div>


    <!-- IMAGE AFTER UNLOCK -->
    <div id="resultScreen">

      <img
        src="./wall.png"
        alt="./wall.png">

    </div>


    <!-- FADE -->
    <div id="fade"></div>

  </main>


  <script src="script.js"></script>

</body>
</html>
